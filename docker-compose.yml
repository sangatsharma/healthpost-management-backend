services:
  db:
    image: postgres
    ports:
      - 5454:5432
    restart: always
    shm_size: 128mb
    container_name: health_mgnt
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: health

    volumes: 
      - ./database/db:/var/lib/postgresql/data

    

